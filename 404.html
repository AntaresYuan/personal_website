<!DOCTYPE html>
<!-- 404 page — Cloudflare Pages serves this for not-found requests. Static
     (no build step / cache-bust): a slightly-stale stylesheet on a 404 is
     harmless, and this way it works in any clone without running the build.
     If you fork: the brand name in the topnav is the one thing to change. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130D" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var d = document.documentElement, m = 'auto';
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') m = t; } catch (e) {}
    var sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    d.setAttribute('data-theme-mode', m);
    d.setAttribute('data-theme', m === 'auto' ? (sysDark ? 'dark' : 'light') : m);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="/styles/main.css">
</head>
<body class="notfound-page">
<main class="page">
  <nav class="topnav">
    <div class="brand"><a class="brand-link" href="/"><span class="dot"></span><span>Antares Yuan</span></a></div>
    <div class="topnav-end"><a class="topnav-link" href="/blog/">blog</a></div>
  </nav>
  <section class="notfound">
    <p class="notfound-code">404</p>
    <h1 class="notfound-title">This page wandered off.</h1>
    <p class="notfound-msg">Broken link, moved post, or it never existed — no harm done. Try one of these:</p>
    <p class="notfound-links"><a href="/">home</a> · <a href="/blog/">writing</a> · <a href="/#agents">/agents</a></p>
  </section>
  <footer class="site-footer">
    <span><em>Lost? The home page is a working roadmap; the blog has the writeups.</em></span>
    <span><a href="/">home</a> · <a href="/blog/">blog</a> · <a href="/admin/">edit</a> · <a href="https://github.com/AntaresYuan/personal_website" title="Open-source template — fork it freely; a link back is appreciated">source</a></span>
  </footer>
</main>
</body>
</html>
