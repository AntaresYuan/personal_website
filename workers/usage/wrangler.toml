# ─────────────────────────────────────────────────────────────────────
# Cloudflare Worker config for the "/usage" public dashboard endpoint.
#
# It receives per-day, per-source usage from one or more sync agents
# (the local jsonl reader, future API-based pollers) via authenticated
# POST, stores per-source slots in KV, and exposes only the SUM across
# sources via a public GET. See README.md for the privacy contract.
#
# One-time deploy:
#   cd workers/usage
#   npx wrangler login                                # browser auth
#   npx wrangler kv namespace create USAGE_KV         # copy the id below (v3+ syntax)
#   # paste the returned id into the [[kv_namespaces]] block, then:
#   npx wrangler secret put SHARED_SECRET             # paste bearer
#   npx wrangler deploy
#
# After deploy, bind the custom domain in the Cloudflare dashboard:
#   Worker → Settings → Domains & Routes → Add Custom Domain →
#   usage.antaresyuan.site
# (Same-zone Anycast endpoints = mainland-CN reachable.)
# ─────────────────────────────────────────────────────────────────────

name = "antares-usage"
main = "src/index.js"
compatibility_date = "2026-05-13"

# Custom domain on the same zone as the main site. Same-zone Anycast =
# same endpoints that serve antaresyuan.site, so CN-reachable. The
# *.workers.dev URL stays off (workers_dev = false) — that fallback is
# intermittently DNS-poisoned in mainland China and we don't want it as
# the public surface. The Cloudflare dashboard mirrors this binding.
workers_dev = false
routes = [
  { pattern = "usage.antaresyuan.site", custom_domain = true },
]

[observability]
enabled = true

# ── Public projection (privacy switchboard) ──────────────────────────
# The agent uploads full detail (five token categories + per-tool /
# per-model / per-project breakdowns) and the Worker stores all of it.
# This var decides what the PUBLIC GET / is allowed to emit. Anything not
# listed here stays server-side, reachable only via authed GET /detail.
#
# Private by default: with USAGE_PUBLISH unset, GET / returns exactly the
# v1 shape {date, tokens, sessions, costCents} — same bytes as before.
#
#   fields  extra per-day scalars to publish. Valid names:
#             inputTokens, outputTokens, cachedInputTokens,
#             cacheCreationInputTokens, reasoningOutputTokens, totalTokens,
#             activeSeconds, durationSeconds, messageCount, userMessageCount
#   dims    breakdown maps to publish: bySource, byModel, byProject
#
# The frontend is data-driven: publishing a field makes it appear on the
# page, removing it makes it disappear — no site rebuild required.
# Unknown names are ignored, and malformed JSON falls back to
# private-by-default rather than over-sharing.
#
# Examples:
#   Show the real total + cache ratio + which tool did the work, but keep
#   model ids and project names private:
#     USAGE_PUBLISH = '{"fields":["totalTokens","cachedInputTokens"],"dims":["bySource"]}'
#
#   Also reveal model mix:
#     USAGE_PUBLISH = '{"fields":["totalTokens","cachedInputTokens"],"dims":["bySource","byModel"]}'
#
#   Back to v1 (nothing extra):
#     USAGE_PUBLISH = '{}'
[vars]
USAGE_PUBLISH = '{"fields":["totalTokens","cachedInputTokens","inputTokens","outputTokens","cacheCreationInputTokens","reasoningOutputTokens","activeSeconds","messageCount"],"dims":["bySource","promptWeekHours","toolCounts"]}'

# KV — per-day map keyed by source slot. Created via:
#   npx wrangler kv namespace create USAGE_KV     (Wrangler v3+ — space not colon)
# then paste the returned id below (replace the placeholder).
[[kv_namespaces]]
binding = "USAGE_KV"
id = "5631e998e52448ea85bc426b81aa5712"

# SHARED_SECRET is bound at deploy time via:
#   npx wrangler secret put SHARED_SECRET
# Never committed.
