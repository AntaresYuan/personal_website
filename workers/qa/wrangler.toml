# ─────────────────────────────────────────────────────────────────────
# Cloudflare Worker config for the "ask this portfolio" Q&A endpoint.
#
# It answers a visitor's question using the Work corpus plus the owner's
# Assistant guide, FAQ answers and background knowledge. It retrieves the
# relevant passages from https://antaresyuan.site/ask-index.json
# (scripts/build-ask-index.js) and answers from the model on Antares's Mac
# when it is reachable, else Workers AI. Personal does not load this Worker.
#
# Deploy:
#   cd workers/qa
#   npx wrangler login          # one-time, browser auth
#   npx wrangler deploy
#
# After first deploy the URL is:
#   https://antares-qa.<your-subdomain>.workers.dev
#
# Put that URL into content/site.json → qa.workerUrl (or via /admin/ →
# Site meta → Q&A assistant). Empty there disables the Work assistant service.
# ─────────────────────────────────────────────────────────────────────

name = "antares-qa"
main = "src/index.js"
compatibility_date = "2026-05-09"

# Workers AI — auto-provisioned, just bind it. Used as `env.AI.run(model, …)`.
[ai]
binding = "AI"

# Live token totals stay behind Worker-to-Worker access. `antares-qa` gets a
# fetch-only service binding to the existing usage Worker; no bearer secret or
# browser-visible endpoint is needed for the assistant tool.
[[services]]
binding = "USAGE"
service = "antares-usage"

# Short-lived, privacy-conscious debugging trajectories. Each answer returns
# its AQ-* id; the matching record is retained for 14 days and stores no IP.
[[kv_namespaces]]
binding = "QA_TRACE"
id = "af132d82c9c84668a9b72656d51b317e"

# D1 is the primary trajectory store. Unlike free-tier KV, its write budget is
# appropriate for one record per assistant query. KV remains as a fallback for
# existing deployments and can be removed after the migration settles.
[[d1_databases]]
binding = "QA_DB"
database_name = "antares-qa-traces"
database_id = "f893a25e-b68d-40b7-8857-f1156b40d23c"

[observability]
enabled = true

# ── Optional: per-IP rate limiting ───────────────────────────────────
# Cloudflare's native rate-limit binding (no KV namespace to create).
# Uncomment, run `npx wrangler deploy`, and the Worker will 429 abusers.
# The Workers-AI free-tier daily budget is the backstop if you skip this.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }   # 20 requests / 60 s per key (IP)

# ── Answering from Antares's Mac (optional) ──────────────────────────
# LOCAL_LLM_URL: the Cloudflare Tunnel hostname in front of the local-llm
# proxy (ops/local-llm/README.md). Empty = cloud only. The Access service
# token that guards it goes in as secrets, never here:
#   npx wrangler secret put ACCESS_CLIENT_ID
#   npx wrangler secret put ACCESS_CLIENT_SECRET
[vars]
LOCAL_LLM_URL = "https://llm.antaresyuan.site"
# The agent: the model picks a skill and calls the tools (src/agent.js).
# "off" answers every question with the fixed pipeline instead.
AGENT_MODE = "on"

