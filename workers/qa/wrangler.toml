# ─────────────────────────────────────────────────────────────────────
# Cloudflare Worker config for the "ask this portfolio" Q&A endpoint.
#
# It answers a visitor's question using ONLY the site's own content: it
# retrieves the relevant passages from https://antaresyuan.site/ask-index.json
# (scripts/build-ask-index.js) and answers from the model on Antares's Mac
# when it is reachable, else Workers AI. Free tier covers it for a personal site. This powers the
# embedded terminal's `ask <question>` command; the ⌘K palette is a plain
# search/launcher and needs no Worker.
#
# Deploy:
#   cd workers/qa
#   npx wrangler login          # one-time, browser auth
#   npx wrangler deploy
#
# After first deploy the URL is:
#   https://antares-qa.<your-subdomain>.workers.dev
#
# Put that URL into content/site.json → qa.workerUrl (or via /admin/ →
# Site meta → Q&A assistant). Empty there ⇒ the terminal's `ask` says so.
# ─────────────────────────────────────────────────────────────────────

name = "antares-qa"
main = "src/index.js"
compatibility_date = "2026-05-09"

# Workers AI — auto-provisioned, just bind it. Used as `env.AI.run(model, …)`.
[ai]
binding = "AI"

[observability]
enabled = true

# ── Optional: per-IP rate limiting ───────────────────────────────────
# Cloudflare's native rate-limit binding (no KV namespace to create).
# Uncomment, run `npx wrangler deploy`, and the Worker will 429 abusers.
# The Workers-AI free-tier daily budget is the backstop if you skip this.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }   # 20 requests / 60 s per key (IP)

# ── Answering from Antares's Mac (optional) ──────────────────────────
# LOCAL_LLM_URL: the Cloudflare Tunnel hostname in front of the local-llm
# proxy (ops/local-llm/README.md). Empty = cloud only. The Access service
# token that guards it goes in as secrets, never here:
#   npx wrangler secret put ACCESS_CLIENT_ID
#   npx wrangler secret put ACCESS_CLIENT_SECRET
[vars]
LOCAL_LLM_URL = ""

