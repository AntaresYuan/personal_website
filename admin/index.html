<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content · Antares Yuan</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; }
    #cms-loading-msg {
      max-width: 480px; margin: 80px auto; padding: 24px;
      background: #fff8dc; border: 1px solid #f0d568; border-radius: 8px;
      color: #5a4a00; line-height: 1.5; font-size: 14px;
    }
    #cms-loading-msg code {
      background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- Fallback message — visible only if the CMS fails to mount (bundle didn't
       load, JS error, …). Removed by the script's onload handler (and, anyway,
       the CMS replaces the body content when it boots). -->
  <div id="cms-loading-msg">
    <strong>Loading the CMS…</strong><br>
    If this message stays for more than 10 seconds, the CMS bundle failed to
    load. Open your browser's Web Inspector → Console tab and report the red
    error to <code>chenjy4@uw.edu</code>.
  </div>

  <!-- Sveltia CMS — a modern, ~5× faster, ~1/3 the size successor to Decap CMS
       (https://github.com/sveltia/sveltia-cms). In-browser CMS that commits
       content edits to the GitHub repo. Reads the same admin/config.yml and
       uses the same GitHub OAuth (the workers/decap-oauth Worker — Sveltia
       speaks the same OAuth protocol as Decap). Single editor: only repo
       collaborators can authenticate; public visitors hit /admin/ but can't
       log in.

       Vendored (admin/sveltia-cms.js, v0.160.0) rather than loaded from a
       public npm CDN — jsDelivr/unpkg are unreliable from mainland CN. MUST
       sit at the end of <body> (the CMS mounts into document.body). The onload
       handler clears the fallback message once the bundle has loaded.

       ── Rollback ─────────────────────────────────────────────────────────
       To switch back to Decap CMS (still vendored at admin/decap-cms.js):
       comment out the Sveltia <script> below and uncomment the Decap one.
       Both read admin/config.yml; no other change needed. -->
  <script
    src="./sveltia-cms.js"
    onload="document.getElementById('cms-loading-msg')?.remove()"></script>
  <!-- Decap CMS (fallback) — see "Rollback" above:
  <script src="./decap-cms.js" onload="document.getElementById('cms-loading-msg')?.remove()"></script>
  -->
</body>
</html>
