<g class="pc-ta"><rect class="pc-b" x="258" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="258" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="352" y="148">Controllable</text><text class="pc-s" x="352" y="179">where it appears,</text><text class="pc-s" x="352" y="201">which type it is</text></g>
<g class="pc-ta"><rect class="pc-b" x="482" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="148">Code injection</text><text class="pc-s" x="576" y="179">9 types, on 55</text><text class="pc-s" x="576" y="201">real websites</text></g>
<g class="pc-ta"><rect class="pc-b" x="718" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="148">Eval framework</text><text class="pc-s" x="812" y="179">inject, run, judge;</text><text class="pc-s" x="812" y="201">5 agents, one setup</text></g>
<g class="pc-ta"><rect class="pc-b" x="966" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="148">Same weak spots</text><text class="pc-s" x="1060" y="179">Preselection, Trick</text><text class="pc-s" x="1060" y="201">Wording, Hidden Info</text></g>
<g class="pc-tb"><rect class="pc-b" x="34" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="34" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="128" y="300">Agents act</text><text class="pc-s" x="128" y="331">on real interfaces,</text><text class="pc-s" x="128" y="353">for their users</text></g>
<g class="pc-tb"><rect class="pc-b" x="258" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="258" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="352" y="300">Realistic</text><text class="pc-s" x="352" y="331">or the results</text><text class="pc-s" x="352" y="353">won’t transfer</text></g>
<g class="pc-tb"><rect class="pc-b" x="482" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="300">User study</text><text class="pc-s" x="576" y="331">29 people; most</text><text class="pc-s" x="576" y="353">never noticed</text></g>
<g class="pc-tb"><rect class="pc-b" x="718" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="300">Test cases</text><text class="pc-s" x="812" y="331">goal, step, misstep:</text><text class="pc-s" x="812" y="353"><tspan class="pc-k">313</tspan> tasks</text></g>
<g class="pc-tb"><rect class="pc-b" x="966" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="300">Overt ones</text><text class="pc-s" x="1060" y="331">people and agents</text><text class="pc-s" x="1060" y="353">both resist them</text></g>
