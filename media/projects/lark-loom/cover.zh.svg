<g class="pc-tb"><rect class="pc-b" x="482" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="300">Skills</text><text class="pc-s" x="576" y="331">用召回的 context</text><text class="pc-s" x="576" y="353">产出文档、表格、幻灯片</text></g>
<g class="pc-tb"><rect class="pc-b" x="718" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="300">模型分层</text><text class="pc-s" x="812" y="331">Lite 做准备，</text><text class="pc-s" x="812" y="353">Pro 做推理</text></g>
<g class="pc-tb"><rect class="pc-b" x="966" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="300">响应时间</text><text class="pc-s" x="1060" y="331">单任务</text><text class="pc-s" x="1060" y="353">95 秒 → <tspan class="pc-k">50 秒</tspan></text></g>
