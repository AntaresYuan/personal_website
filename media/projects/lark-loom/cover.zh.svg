<g class="pc-ta"><rect class="pc-b" x="482" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="148">Memory</text><text class="pc-s" x="576" y="179">把聊天存成</text><text class="pc-s" x="576" y="201">结构化记忆</text></g>
<g class="pc-ta"><rect class="pc-b" x="718" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="148">存与选</text><text class="pc-s" x="812" y="179">Lite 抽取；</text><text class="pc-s" x="812" y="201">关键词 + 任务召回</text></g>
<g class="pc-ta"><rect class="pc-b" x="966" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="148">通过率</text><text class="pc-s" x="1060" y="179">60 条评测集</text><text class="pc-s" x="1060" y="201">65% → <tspan class="pc-k">80%</tspan></text></g>
<g class="pc-tb"><rect class="pc-b" x="34" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="34" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="128" y="300">用不上</text><text class="pc-s" x="128" y="331">模型消费不了</text><text class="pc-s" x="128" y="353">聊天记录</text></g>
