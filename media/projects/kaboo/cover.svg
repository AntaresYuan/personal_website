<g class="pc-tb"><rect class="pc-b" x="184.2" y="426" width="16" height="16" rx="5"/><rect class="pc-c" x="184.2" y="426" width="16" height="16" rx="5"/></g><text class="pc-l" x="210.2" y="439">What I built</text>
