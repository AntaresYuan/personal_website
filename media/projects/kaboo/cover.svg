<svg xmlns="http://www.w3.org/2000/svg" class="pc pc-kaboo" viewBox="0 0 1200 480" role="img" aria-label="Kaboo: token analysis inside ByteDance, built by one owner from problem to production">
<!-- kaboo cover, drawn by tools/covers/covers.js — edit that, not this. -->
<style>
.pc { --pc-h: var(--hue, 262);
  --pc-glass: rgba(255,255,255,.62); --pc-group: rgba(255,255,255,.3); --pc-dash: rgba(29,29,31,.22);
  --pc-ink: var(--text, #1D1D1F); --pc-ink-2: var(--text-2, #4F4F55); --pc-ink-3: var(--text-3, #6E6E73);
  --pc-a: oklch(0.48 0.18 var(--pc-h)); --pc-a-tint: oklch(0.64 0.18 var(--pc-h) / .15); --pc-a-line: oklch(0.56 0.17 var(--pc-h) / .44);
  --pc-b-line: rgba(0,0,0,.1);
  font-family: var(--font, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif); }
:root[data-theme="dark"] .pc { --pc-glass: rgba(255,255,255,.045); --pc-group: rgba(255,255,255,.02); --pc-dash: rgba(255,255,255,.2);
  --pc-a: oklch(0.85 0.13 var(--pc-h)); --pc-a-tint: oklch(0.62 0.16 var(--pc-h) / .25); --pc-a-line: oklch(0.78 0.14 var(--pc-h) / .46);
  --pc-b-line: rgba(255,255,255,.13); }
.pc text { text-anchor: middle; }
.pc-h { font: 600 21px var(--font-display, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif); letter-spacing: -.01em; fill: var(--pc-ink); }
.pc-h.pc-me { fill: var(--pc-a); }
.pc-hs { font-size: 15.5px; fill: var(--pc-ink-2); }
.pc-g { fill: var(--pc-group); stroke: var(--pc-dash); stroke-width: 1.5; stroke-dasharray: 5 7; }
.pc-b { fill: var(--pc-glass); }
.pc-c { stroke-width: 1.5; }
.pc-ta .pc-c { fill: var(--pc-a-tint); stroke: var(--pc-a-line); }
.pc-tb .pc-c { fill: none; stroke: var(--pc-b-line); }
.pc-t { font: 600 22px var(--font-display, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif); letter-spacing: -.015em; }
.pc-ta .pc-t { fill: var(--pc-a); }
.pc-tb .pc-t { fill: var(--pc-ink); }
.pc-s { font-size: 16px; fill: var(--pc-ink-2); }
.pc-k { font-weight: 700; fill: var(--pc-a); }
.pc-a { fill: none; stroke: var(--pc-ink-3); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pc-l { text-anchor: start !important; font-size: 15px; fill: var(--pc-ink-2); }
</style>
<!-- column heads -->
<text class="pc-h" x="128" y="46">Project</text><text class="pc-hs" x="128" y="70">Token analysis</text>
<text class="pc-h" x="352" y="46">Way of work</text><text class="pc-hs" x="352" y="70">One owner, end to end</text>
<text class="pc-h" x="576" y="46">Infrastructure</text><text class="pc-hs" x="576" y="70">mew, in Lark</text>
<text class="pc-h pc-me" x="812" y="46">My work</text><text class="pc-hs" x="812" y="70">On token efficiency</text>
<text class="pc-h" x="1060" y="46">Result</text><text class="pc-hs" x="1060" y="70">In production</text>
<!-- groups: my work, metrics -->
<rect class="pc-g" x="706" y="92" width="212" height="304" rx="32"/>
<rect class="pc-g" x="954" y="92" width="212" height="304" rx="32"/>
<!-- nodes -->
<g class="pc-ta"><rect class="pc-b" x="34" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="34" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="128" y="148">Kaboo</text><text class="pc-s" x="128" y="179">open source,</text><text class="pc-s" x="128" y="201">inside ByteDance</text></g>
<g class="pc-ta"><rect class="pc-b" x="258" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="258" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="352" y="148">No relay</text><text class="pc-s" x="352" y="179">raise it, solve it,</text><text class="pc-s" x="352" y="201">test it, ship it</text></g>
<g class="pc-ta"><rect class="pc-b" x="482" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="148">mew</text><text class="pc-s" x="576" y="179">agents built into</text><text class="pc-s" x="576" y="201">the dev process</text></g>
<g class="pc-ta"><rect class="pc-b" x="718" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="148">The problem</text><text class="pc-s" x="812" y="179">tasks that succeed</text><text class="pc-s" x="812" y="201">but waste tokens</text></g>
<g class="pc-ta"><rect class="pc-b" x="966" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="148">Shipped</text><text class="pc-s" x="1060" y="179">tested and</text><text class="pc-s" x="1060" y="201">deployed by me</text></g>
<g class="pc-tb"><rect class="pc-b" x="34" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="34" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="128" y="300">Token use</text><text class="pc-s" x="128" y="331">where the tokens</text><text class="pc-s" x="128" y="353">go, and why</text></g>
<g class="pc-tb"><rect class="pc-b" x="258" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="258" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="352" y="300">Two safeguards</text><text class="pc-s" x="352" y="331">agent review first,</text><text class="pc-s" x="352" y="353">rollback after</text></g>
<g class="pc-tb"><rect class="pc-b" x="482" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="300">In Lark</text><text class="pc-s" x="576" y="331">the path from idea</text><text class="pc-s" x="576" y="353">to release, paved</text></g>
<g class="pc-tb"><rect class="pc-b" x="718" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="300">The fix</text><text class="pc-s" x="812" y="331">5 waste criteria,</text><text class="pc-s" x="812" y="353">Effective Tokens</text></g>
<g class="pc-tb"><rect class="pc-b" x="966" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="300">Reach</text><text class="pc-s" x="1060" y="331"><tspan class="pc-k">10K+</tspan> internal</text><text class="pc-s" x="1060" y="353">users</text></g>
