<g class="pc-tb"><rect class="pc-b" x="718" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="148">体验迭代</text><text class="pc-s" x="812" y="179">基于反馈的</text><text class="pc-s" x="812" y="201">预制 prompt</text></g>
<g class="pc-tb"><rect class="pc-b" x="966" y="104" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="104" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="148">全不全</text><text class="pc-s" x="1060" y="179">漏推的</text><text class="pc-s" x="1060" y="201">候选人</text></g>
<g class="pc-tb"><rect class="pc-b" x="34" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="34" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="128" y="300">质量</text><text class="pc-s" x="128" y="331">依赖 TA</text><text class="pc-s" x="128" y="353">个人能力</text></g>
<g class="pc-tb"><rect class="pc-b" x="258" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="258" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="352" y="300">需求理解</text><text class="pc-s" x="352" y="331">岗位真正要</text><text class="pc-s" x="352" y="353">什么样的人</text></g>
<g class="pc-tb"><rect class="pc-b" x="482" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="482" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="576" y="300">Agentic Hiring</text><text class="pc-s" x="576" y="331">澄清、召回、</text><text class="pc-s" x="576" y="353">精评、精排</text></g>
<g class="pc-tb"><rect class="pc-b" x="718" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="718" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="812" y="300">效果优化</text><text class="pc-s" x="812" y="331">badcase</text><text class="pc-s" x="812" y="353">归因</text></g>
<g class="pc-tb"><rect class="pc-b" x="966" y="256" width="188" height="128" rx="20"/><rect class="pc-c" x="966" y="256" width="188" height="128" rx="20"/><text class="pc-t" x="1060" y="300">准不准</text><text class="pc-s" x="1060" y="331">通过率</text><text class="pc-s" x="1060" y="353">21% → <tspan class="pc-k">25%</tspan></text></g>
