<text class="pc-h" x="128" y="46">业务问题</text><text class="pc-hs" x="128" y="70">诉求没被满足</text>
<text class="pc-h" x="352" y="46">业务场景</text><text class="pc-hs" x="352" y="70">人 × 岗位</text>
