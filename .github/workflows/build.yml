name: Rebuild artifacts

# Sveltia CMS (via /admin/) commits edits to content/** — the source of
# truth — but it does NOT run the build. This workflow regenerates the
# committed artifacts (index.html, blog/, llms.txt, llms-full.txt,
# sitemap.xml, agent-brief.txt) so they stay in sync, then commits them
# back to main.
#
# Loop safety: the bot commit only touches artifacts, never content/**,
# scripts/** or styles/**, so it cannot re-trigger this workflow via the
# paths filter. `[skip ci]` in the message is a belt-and-suspenders 2nd guard.
#
# styles/** is in the filter because index.html embeds a content-hash of
# styles/main.css as a `?v=` cache-bust — a CSS-only edit must rebuild so the
# hash (and thus the served stylesheet) updates.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'styles/**'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: rebuild-artifacts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install — the build is pure-Node stdlib; resvg-wasm (for the OG
      # cards) is vendored at vendor/resvg/.
      - name: Build
        run: node scripts/build.js

      - name: Commit artifacts if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Artifacts already in sync — nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore: rebuild artifacts from content [skip ci]"
          git push origin HEAD:main
